# LinkOS Mirrors：每个上游一个独立的拉取缓存（pull-through cache），各自独立存储，
# 前面由 registry-gate 统一把关：只放行拉取（GET、HEAD），拒绝写入和 /v2/_catalog。
# 端口 5001-5005 依次对应 Docker Hub、gcr.io、ghcr.io、registry.k8s.io、quay.io。
x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "3"

x-registry: &registry
  image: registry:3.1.2
  restart: always
  environment:
    OTEL_TRACES_EXPORTER: none
    OTEL_SDK_DISABLED: "true"
  logging: *logging
  networks: [registry-net]

services:
  registry-gate:
    container_name: registry-gate
    image: nginx:1.30.6-alpine
    restart: always
    volumes:
      - ./gate.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 5001:8001
      - 5002:8002
      - 5003:8003
      - 5004:8004
      - 5005:8005
    depends_on: [registry-dockerhub, registry-gcr, registry-ghcr, registry-k8s, registry-quay]
    logging: *logging
    networks: [registry-net]

  registry-dockerhub:
    <<: *registry
    container_name: registry-dockerhub
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./registry-dockerhub.yml:/etc/distribution/config.yml:ro
      - ./data/dockerhub:/var/lib/registry

  registry-gcr:
    <<: *registry
    container_name: registry-gcr
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./registry-gcr.yml:/etc/distribution/config.yml:ro
      - ./data/gcr:/var/lib/registry

  registry-ghcr:
    <<: *registry
    container_name: registry-ghcr
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./registry-ghcr.yml:/etc/distribution/config.yml:ro
      - ./data/ghcr:/var/lib/registry

  registry-k8s:
    <<: *registry
    container_name: registry-k8s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./registry-k8s.yml:/etc/distribution/config.yml:ro
      - ./data/k8s:/var/lib/registry

  registry-quay:
    <<: *registry
    container_name: registry-quay
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./registry-quay.yml:/etc/distribution/config.yml:ro
      - ./data/quay:/var/lib/registry

networks:
  registry-net: {}
