# LinkOS Mirrors（缓存版）：一个 Caddy 加一个 zot。
# Caddy 使用宿主机网络（仅 Linux）：tls 模式监听 80、443，http 模式监听 5001–5005，
# 需要登录的入口（AUTH_MODE=http）另外监听 15001–15005；
# 指标只在 127.0.0.1:9180，管理接口只在 localhost:2019。
# zot 只在 127.0.0.1:5100 上给 Caddy 用，镜像缓存在 ./data/zot。配置项见 .env.sample。
x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "3"

services:
  caddy:
    container_name: mirrors-caddy
    image: caddy:2.11.7-alpine
    restart: always
    network_mode: host
    environment:
      MODE: ${MODE:-tls}
      DOMAIN: ${DOMAIN:-}
      BIND: ${BIND:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
      ZOT_ADDR: 127.0.0.1:${ZOT_PORT:-5100}
      PORT_DOCKER: ${PORT_DOCKER:-5001}
      PORT_GCR: ${PORT_GCR:-5002}
      PORT_GHCR: ${PORT_GHCR:-5003}
      PORT_K8S: ${PORT_K8S:-5004}
      PORT_QUAY: ${PORT_QUAY:-5005}
      AUTH_MODE: ${AUTH_MODE:-off}
      AUTH_DOMAIN: ${AUTH_DOMAIN:-}
      AUTH_PORT_DOCKER: ${AUTH_PORT_DOCKER:-15001}
      AUTH_PORT_GCR: ${AUTH_PORT_GCR:-15002}
      AUTH_PORT_GHCR: ${AUTH_PORT_GHCR:-15003}
      AUTH_PORT_K8S: ${AUTH_PORT_K8S:-15004}
      AUTH_PORT_QUAY: ${AUTH_PORT_QUAY:-15005}
    volumes:
      - ./caddy:/etc/caddy:ro
      - ./web:/srv/web:ro # 浏览器打开域名时的用法页
      - ./data/caddy:/data # 证书和 ACME 账号
      - ./data/caddy-config:/config
      - ./logs:/var/log/caddy # 访问日志，Caddy 自行轮转
    depends_on: [zot]
    logging: *logging

  zot:
    container_name: mirrors-zot
    image: ghcr.io/project-zot/zot:v2.1.22
    restart: always
    command: ["serve", "/etc/zot/config.yaml"]
    ports:
      - 127.0.0.1:${ZOT_PORT:-5100}:5000
    volumes:
      - ./zot/config.yaml:/etc/zot/config.yaml:ro
      - ./data/zot:/var/lib/registry
    logging: *logging
