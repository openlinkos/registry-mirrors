# Pull-only gate in front of the pull-through caches. Only GET and HEAD reach a cache; the catalog
# (which would list every repository users have pulled) and every write are refused here, so the
# rules hold even when a client bypasses the CDN and connects to the origin ports directly.
map $request_method $pull_only {
    GET 1;
    HEAD 1;
    default 0;
}

# A cache keeps a layer only if its first transfer from upstream completes, and it fetches that
# layer while sending it. So read every response from the caches at full speed (buffering, with
# temporary files for large layers) and finish it even when the client goes away. A slow or flaky
# client then gets the layer from the cache on its next try, and can resume it with Range requests.
proxy_buffering on;
proxy_max_temp_file_size 4096m;
proxy_ignore_client_abort on;

server {
    listen 8001;
    server_tokens off;
    client_max_body_size 1k;

    location = /v2/_catalog { return 404; }

    location / {
        if ($pull_only = 0) { return 405; }
        proxy_pass http://registry-dockerhub:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}

