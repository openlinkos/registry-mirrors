version: 0.1
log:
  fields:
    service: registry-dockerhub
storage:
  filesystem:
    rootdirectory: /var/lib/registry
  # Lets the proxy expire cached content after proxy.ttl.
  delete:
    enabled: true
  cache:
    blobdescriptor: inmemory
http:
  addr: :5000
  headers:
    X-Content-Type-Options: [nosniff]
health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
proxy:
  remoteurl: https://registry-1.docker.io
  ttl: 168h
